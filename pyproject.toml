[project]
name = "refaudit"
version = "0.1.0"
description = "Audit who gets referred by selective skin-image classifiers, using capture-condition counterfactuals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "requests>=2.31",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "timm>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
